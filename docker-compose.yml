services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ehr
      POSTGRES_PASSWORD: ehr
      POSTGRES_DB: ehr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehr -d ehr"]
      interval: 2s
      retries: 30

  loader:
    build: .
    environment:
      EHR_ASOF_DATABASE_URL: postgresql+psycopg://ehr:ehr@db:5432/ehr
    # Synthetic data only: the risk model is trained here and shared with the API.
    command: ["sh", "-c", "ehr-asof synth --out /tmp/data --patients 500 && ehr-asof load-db --data /tmp/data && ehr-asof train --data /tmp/data --out /models/risk.pkl"]
    volumes:
      - models:/models
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      EHR_ASOF_DATABASE_URL: postgresql+psycopg://ehr:ehr@db:5432/ehr
      WEB_CONCURRENCY: ${WORKERS:-2}
      EHR_ASOF_MODEL_PATH: /models/risk.pkl
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom
    volumes:
      - models:/models:ro
    ports:
      - "8765:8000"
    depends_on:
      db:
        condition: service_healthy
      loader:
        condition: service_completed_successfully

volumes:
  pgdata:
  models: