[project]
name = "ehr-asof"
version = "0.1.0"
description = "Point-in-time (as-of) features for EHR data, and a measurement of how much EHR models leak the future."
readme = "README.md"
authors = [
    { name = "Eric Yang", email = "159638721+yangpings@users.noreply.github.com" }
]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "prometheus-client>=0.26.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
ehr-asof = "ehr_asof.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.5",
    "scipy>=1.17.1",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --cov=ehr_asof --cov-report=term-missing"
testpaths = ["tests"]
markers = ["slow: statistical or end-to-end tests"]
